name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17


      - name: Instalar dependencias
        run: npm ci

      - name: Generar proyecto Android
        run: npx expo prebuild --platform android --no-install
        env:
          EXPO_OFFLINE: 1

      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Renombrar APK
        run: cp android/app/build/outputs/apk/release/app-release.apk gps-logger.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: GPS Logger v${{ github.run_number }}
          files: gps-logger.apk
